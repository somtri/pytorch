name: Binary docker build

description: Build docker image for binary builds

inputs:
  docker-image-name:
    description: Docker image name for PR builds
    required: true
  docker-build-dir:
    description: Location of the build.sh relative to .ci/docker
    required: true
  custom-tag-prefix:
    description: Custom tag prefix for the docker image
    required: false
  DOCKER_TOKEN:
    description: Docker token for authentication
    required: true
  DOCKER_ID:
    description: Docker ID for authentication
    required: true
  GHCR_TOKEN:
    description: Token for pushing PR images to ghcr.io/pytorch/ci-image (built-in GITHUB_TOKEN)
    required: false
  GHCR_USER:
    description: Username for the ghcr.io login on the PR path
    required: false

runs:
  using: composite
  steps:
    - name: Checkout PyTorch
      uses: pytorch/pytorch/.github/actions/checkout-pytorch@main

    # Build on a remote BuildKit builder (OSDC/ARC has no host docker daemon)
    # and push straight to the registry. The referenced <docker-build-dir>/build.sh
    # honors REMOTE_BUILDKIT (see .ci/docker/build.sh).
    - name: Set up Docker Buildx (remote, no bootstrap)
      shell: bash
      run: |
        set -ex
        case "$(uname -m)" in
          aarch64|arm64) buildkit_addr="tcp://buildkitd-arm64.buildkit:1234" ;;
          *)             buildkit_addr="tcp://buildkitd-amd64.buildkit:1234" ;;
        esac
        docker buildx create \
          --name remote-buildkit \
          --driver remote \
          --use \
          "${buildkit_addr}"

    - name: Build (and, on push, publish) via remote BuildKit
      env:
        REMOTE_BUILDKIT: "1"
        DOCKER_TOKEN: ${{ inputs.DOCKER_TOKEN }}
        DOCKER_ID: ${{ inputs.DOCKER_ID }}
        GHCR_TOKEN: ${{ inputs.GHCR_TOKEN }}
        GHCR_USER: ${{ inputs.GHCR_USER }}
        DOCKER_IMAGE_NAME: ${{ inputs.docker-image-name }}
        DOCKER_IMAGE_PREFIX: ${{ inputs.custom-tag-prefix }}
        DOCKER_BUILD_DIR: ${{ inputs.docker-build-dir }}
      shell: bash
      run: |
        set -euxo pipefail

        # checkout-pytorch may leave the tree owned by a different uid than the
        # step user on ARC; avoid git's "dubious ownership" error for rev-parse.
        git config --global --add safe.directory "${GITHUB_WORKSPACE}"

        GITHUB_REF=${GITHUB_REF:-$(git symbolic-ref -q HEAD || git describe --tags --exact-match)}
        GIT_BRANCH_NAME=${GITHUB_REF##*/}
        GIT_COMMIT_SHA=${GITHUB_SHA:-$(git rev-parse HEAD)}
        CI_FOLDER_SHA=$(git rev-parse HEAD:.ci/docker)

        # Registry + tag set depend on the event:
        #  - pull_request: publish ONLY the content-addressed image to GHCR
        #    ci-image (ghcr.io/pytorch/ci-image:<name>-<variant>-<.ci/docker
        #    hash>), which the ciflow/binaries test run consumes. Keeps per-PR
        #    images off the public Docker Hub repo and off the floating tag.
        #  - push (main / release / rc tags): publish to Docker Hub as before --
        #    branch / commit / .ci/docker-hash tags, plus the floating <prefix>
        #    tag only from main so a release-branch rebuild can't clobber it.
        if [[ "${GITHUB_EVENT_NAME:-}" == "pull_request" ]]; then
          PREFIX="ghcr.io/pytorch/ci-image:${DOCKER_IMAGE_NAME}-${DOCKER_IMAGE_PREFIX}"
          TAGS=(-t "${PREFIX}-${CI_FOLDER_SHA}")
          REGISTRY="ghcr.io"
          LOGIN_USER="${GHCR_USER}"
          LOGIN_TOKEN="${GHCR_TOKEN}"
        else
          PREFIX="docker.io/pytorch/${DOCKER_IMAGE_NAME}:${DOCKER_IMAGE_PREFIX}"
          TAGS=(
            -t "${PREFIX}-${GIT_BRANCH_NAME}"
            -t "${PREFIX}-${GIT_COMMIT_SHA}"
            -t "${PREFIX}-${CI_FOLDER_SHA}"
          )
          if [[ "${GIT_BRANCH_NAME}" == "main" ]]; then
            TAGS+=(-t "${PREFIX}")
          fi
          REGISTRY="docker.io"
          LOGIN_USER="${DOCKER_ID}"
          LOGIN_TOKEN="${DOCKER_TOKEN}"
        fi

        # WITH_PUSH gates publishing (build.sh pushes when it is true; fork PRs
        # have no credentials and stay build-only). Log in only when pushing.
        set +x
        if [[ "${WITH_PUSH:-false}" == "true" ]]; then
          echo "${LOGIN_TOKEN}" | docker login "${REGISTRY}" -u "${LOGIN_USER}" --password-stdin
        fi
        set -x

        # build.sh reads REMOTE_BUILDKIT and buildx-pushes the passed -t tags.
        run_build() {
          ".ci/docker/${DOCKER_BUILD_DIR}/build.sh" "${DOCKER_IMAGE_NAME}:${DOCKER_IMAGE_PREFIX}" "${TAGS[@]}"
        }

        # The autoscaled BuildKit pool may be cold / at capacity at start, where
        # buildx's ~20s connect (gRPC default) fails before scale-up. Retry
        # connection failures (not build errors) so a capacity-limited build waits
        # for a free pod instead of hard-failing -- still within the job timeout.
        attempts="${REMOTE_BUILDKIT_CONNECT_ATTEMPTS:-360}"
        delay="${REMOTE_BUILDKIT_CONNECT_DELAY:-15}"
        for attempt in $(seq 1 "${attempts}"); do
          build_log="$(mktemp)"
          set +e
          run_build 2>&1 | tee "${build_log}"
          rc="${PIPESTATUS[0]}"
          set -e
          if [[ "${rc}" -eq 0 ]]; then
            rm -f "${build_log}"
            break
          fi
          if [[ "${attempt}" -lt "${attempts}" ]] && grep -qiE \
            "waiting for connection|context deadline exceeded|server preface|failed to (dial|list workers)|connection (refused|reset)|no such host|transport: Error|i/o timeout|use of closed network connection|EOF" \
            "${build_log}"; then
            echo "Remote BuildKit not ready yet (attempt ${attempt}/${attempts}); retrying in ${delay}s..." >&2
            rm -f "${build_log}"
            sleep "${delay}"
            continue
          fi
          rm -f "${build_log}"
          exit "${rc}"
        done
